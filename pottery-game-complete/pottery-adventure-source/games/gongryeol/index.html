<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 토기 맞추기| 공렬토기 (구멍무늬토기)</title>
<meta name="description" content="조각의 모양과 빗살무늬를 관찰하며 7조각의 토기를 복원해 보세요.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23192029'/%3E%3Cpath d='M8 7h16c0 10-3 15-8 19C11 22 8 17 8 7Z' fill='%23d89160'/%3E%3Cpath d='m11 11 5 3 5-3m-9 6 4 3 4-3' fill='none' stroke='%23192029' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js","three/addons/":"../../vendor/addons/"}}</script>
</head>
<body>
<div id="app">
<header><div class="brand"><span class="brand-icon" aria-hidden="true">◈</span><div><h1>3D 토기 맞추기</h1></div></div><div class="artifact"><strong>공렬토기 (구멍무늬토기)</strong><span>7조각을 모두 맞춰주세요</span></div><a class="back-to-selection" href="../../select.html">토기 선택</a><button id="restart" class="quiet" disabled>다시 시작</button></header>
<main>
<section id="stage" aria-label="3D 유물 맞추기 작업대" tabindex="0">
<div class="progress-area"><div><span>복원한 조각</span><strong id="count">1 <small>/ 7</small></strong></div><div class="progress" role="progressbar" aria-label="복원 진행률" aria-valuemin="0" aria-valuemax="7" aria-valuenow="1"><i id="progress-fill"></i></div></div>
<canvas id="world" aria-label="빈 공간을 상하좌우로 드래그해 회전, 휠로 확대 또는 축소. 선택한 조각을 드래그해 이동."></canvas>
<div id="loading" role="status"><span class="spinner"></span><strong>유물을 준비하고 있어요</strong></div>
<div id="error" hidden><h2>유물을 불러오지 못했어요</h2><p id="error-text"></p><button onclick="location.reload()">다시 불러오기</button></div>
<div id="toast" role="status" aria-live="polite">아래에서 조각 하나를 선택해 주세요.</div>
<div id="complete" hidden><div class="complete-card"><span class="eyebrow">복원 완료</span><h2>다시 이어진,<br>오래된 시간.</h2><p>일곱 조각이 하나의 공렬토기 (구멍무늬토기)가 되었어요.</p><button id="admire">완성된 토기 살펴보기</button></div></div>
</section>
<section class="tray-section" aria-label="무작위로 놓인 유물 조각"><div class="tray-title"><div><h2>남은 조각 <span id="remaining">6</span></h2></div><p class="tray-help">선택한 토기를 다시 누르면 내려놓을 수 있습니다.</p></div><div id="tray"></div></section>
</main>
<footer>고강선사유적체험관 미니게임 &lt;3D 토기 맞추기&gt;</footer>
</div>
<script type="module" src="./game.js"></script>
</body></html>
