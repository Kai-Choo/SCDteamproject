<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>토기조각 맞추기 게임</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23b86b32' d='M5 5h22c0 12-4 20-11 24C9 25 5 17 5 5Z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./menu.css">
  </head>
  <body>
    <main class="screen">
      <h1 class="sr-only">토기조각 맞추기 게임</h1>
      <img class="art" src="./assets/start.png" alt="선사시대 마을의 토기조각 맞추기 게임 시작 화면">
      <a class="hotspot home" href="../" aria-label="홈 포털로 돌아가기" title="홈 포털로 돌아가기">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5M5.5 9.5V21h13V9.5M9.5 21v-7h5v7" />
        </svg>
      </a>
      <a class="hotspot start" href="./select.html" aria-label="START · 토기 선택 화면으로 이동"></a>
    </main>
    <script>
      const homePortalLink = document.querySelector('.home');
      const returnTo = new URLSearchParams(window.location.search).get('returnTo');
      if (homePortalLink && returnTo) {
        try {
          const portalUrl = new URL(returnTo);
          if (portalUrl.protocol === window.location.protocol && portalUrl.hostname === window.location.hostname) {
            homePortalLink.href = portalUrl.href;
          }
        } catch {
          homePortalLink.href = '/';
        }
      }
    </script>
  </body>
</html>
