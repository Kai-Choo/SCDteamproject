name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install portal dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: 2026-11-26-4-55-32
      - name: Install archery-game dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: ArrowGame-main
      - name: Install harvest-game dependencies
        run: npm install --legacy-peer-deps --no-package-lock --no-audit --no-fund
        working-directory: Kokang2-main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build site and games
        run: npm run build:pages
        working-directory: 2026-11-26-4-55-32
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 2026-11-26-4-55-32/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
