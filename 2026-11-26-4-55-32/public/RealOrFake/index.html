<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>진짜·가짜 유물 찾기</title><link rel="stylesheet" href="style.css"><main><section id="start"><h2>눈썰미로 찾는 청동기 토기</h2><p class="intro">구멍, 무늬, 입술과 받침을 살펴보세요.<br>전시자료의 특징과 같은 토기는 진짜, 다르게 바꾼 토기는 가짜예요.</p><div class="modes"><button data-mode="real">진짜 유물 찾기</button></div></section><section id="play" hidden><div class="topline"><span id="mode"></span><span id="round"></span></div><progress id="progress" max="4" value="0" aria-label="문제 진행률"></progress><div class="cards" id="cards"></div><div class="answer"><h2 id="question"></h2><div id="answer" role="status" aria-live="polite" hidden></div></div><div class="actions"><button id="next" hidden>다음 토기</button></div></section><section id="finish" hidden><h2>관찰을 마쳤어요!</h2><div class="score" id="score"></div><p class="intro">틀린 토기가 있다면 박물관에서 다시 직접 확인하세요!</p><div id="review"></div><div class="actions"><button id="again">다시 도전하기</button></div></section></main><script src="game.js"></script></html>
